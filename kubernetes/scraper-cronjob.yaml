apiVersion: batch/v1
kind: CronJob
metadata:
  name: news-scraper
spec:
  schedule: "*/20 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: news-scraper
            image: 332504859187.dkr.ecr.us-east-1.amazonaws.com/news_scraper:v1
            env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: key
          restartPolicy: OnFailure
