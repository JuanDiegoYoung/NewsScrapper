apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: news-api
  template:
    metadata:
      labels:
        app: news-api
    spec:
      serviceAccountName: scraper-sa
      containers:
      - name: news-api
        image: 332504859187.dkr.ecr.us-east-1.amazonaws.com/news_api:v1
        imagePullPolicy: Always
        command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
        env:
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_STS_REGIONAL_ENDPOINTS
          value: "regional"